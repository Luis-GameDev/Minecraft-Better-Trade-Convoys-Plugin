default-layout: default

layouts:
  default:
    title: "&8Trade Convoy Routes"
    size: 54
    prev-slot: 37
    next-slot: 43

    # Optional, if omitted default slots will be generated in the inner area.
    route-slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
      - 38
      - 39
      - 40
      - 41
      - 42

    border-item:
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      lore: []

    route-item:
      material: PAPER
      name: "&e{route_name}"
      lore:
        - "&7{route_description}"
        - ""
        - "&7Input Item: &f{input_item_amount}x {input_item_material}"
        - "&7Input Money: &f${input_money}"
        - "&7Output Item: &f{output_item_amount}x {output_item_material}"
        - "&7Output Money: &f${output_money}"
        - ""
        - "&8Route ID: &7{route_id}"

    prev-item:
      material: ARROW
      name: "&ePrev"
      lore:
        - "&7Back to previous page"
        - "&8Page: {page}"

    next-item:
      material: ARROW
      name: "&eNext"
      lore:
        - "&7Go to next page"
        - "&8Page: {page}"
