routes:
  # EXAMPLE ROUTE
  iron_to_diamond:
    # Name of the route
    display-name: "Iron → Diamond Run"
    description: "Trade iron for diamonds"
    npc-ids: [0, 1, 2] # NPCs that should have the routes GUI when clicked
    waypoint-world: "world"

    # Movement
    speed: 1                    # Citizens speedModifier (1.0 = normal)
    follow-radius: 10           # Max. Distance Owner ↔ NPC before the NPC stops moving
    expire-seconds: 900         # The time after which the route will forcefully end and return the initial invested items

    announce-start: true        # Whether to announce the start of a route in the global chat
    trade-delay-seconds: 8      # For how long the NPC will stop at the destination before returning back (won't return back if no coordinates follow after the "trade" step)

    # Steps/Waypoints that the NPC will walk
    steps:
      - { x: 100.5, y: 64.0, z: -30.5 }   # Start/Spawn & Home-Pos
      - { x: 120.5, y: 64.0, z: -30.5 }
      - { trade: true, message: "Time to trade." }
      - { x: 140.5, y: 64.0, z: -15.5, message: "All done, heading back!" }    # Last Waypoint = End & Claim-Spot

    # Trade definition
    trades:
      - input:  { material: IRON_INGOT, amount: 20 }
        output: { material: DIAMOND,    amount: 10 }

    daily-limit: 3
    cooldown-seconds: 3600
